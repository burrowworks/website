<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Received — Burrowworks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(80, 80, 120, 0.15), transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(60, 80, 100, 0.12), transparent 50%);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 480px;
    }
    .logo {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 3rem;
    }
    .logo a { color: inherit; text-decoration: none; }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #fafafa;
      margin-bottom: 1.5rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #999;
      font-weight: 300;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #333;
      margin: 2rem auto;
    }
    .back {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.1em;
    }
    .back:hover { color: #888; }
    footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.1em;
    }
    footer a { color: #555; text-decoration: none; }
    footer a:hover { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><a href="/">Burrowworks</a></div>
    <h1>Request received.</h1>
    <div class="divider"></div>
    <p>We've got your data deletion request and will process it within 30 days. You'll receive a confirmation email once it's done.</p>
    <a class="back" href="/">← back to burrowworks.dev</a>
  </div>
  <footer>© 2026 Burrowworks</footer>
</body>
</html>
